name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm exec tsc -b --noEmit

      - name: Run linter
        run: pnpm lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: 'https://mock.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-key'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  detect-tests:
    name: Detect Test Strategy
    runs-on: ubuntu-latest
    outputs:
      run_all_tests: ${{ steps.detect.outputs.run_all_tests }}
      run_unit_tests: ${{ steps.detect.outputs.run_unit_tests }}
      run_integration_tests: ${{ steps.detect.outputs.run_integration_tests }}
      run_e2e_tests: ${{ steps.detect.outputs.run_e2e_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
          else
            git fetch origin main || git fetch origin master
          fi

      - name: Detect which tests to run
        id: detect
        run: |
          chmod +x scripts/detect-tests.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/detect-tests.sh ${{ github.base_ref }}
          else
            ./scripts/detect-tests.sh main
          fi

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [validate, detect-tests]
    if: |
      always() &&
      (needs.validate.result == 'success') &&
      (needs.detect-tests.outputs.run_all_tests == 'true' || 
       needs.detect-tests.outputs.run_unit_tests == 'true' || 
       needs.detect-tests.outputs.run_integration_tests == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: needs.detect-tests.outputs.run_all_tests == 'true' || needs.detect-tests.outputs.run_unit_tests == 'true'
        run: pnpm test:unit

      - name: Run integration tests
        if: needs.detect-tests.outputs.run_all_tests == 'true' || needs.detect-tests.outputs.run_integration_tests == 'true'
        run: pnpm test:integration

      - name: Run tests with coverage
        if: needs.detect-tests.outputs.run_all_tests == 'true'
        run: pnpm test:coverage

      - name: Upload coverage report
        if: needs.detect-tests.outputs.run_all_tests == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, detect-tests, unit-tests]
    if: |
      always() &&
      (needs.build.result == 'success') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.detect-tests.outputs.run_all_tests == 'true' || needs.detect-tests.outputs.run_e2e_tests == 'true')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: 'https://mock.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-key'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
