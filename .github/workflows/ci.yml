name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run linter
        run: pnpm lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: 'https://mock.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-key'

      - name: Enforce bundle budgets
        run: pnpm check:bundle-size

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  detect-tests:
    name: Detect Test Strategy
    runs-on: ubuntu-latest
    outputs:
      run_all_tests: ${{ steps.detect.outputs.run_all_tests }}
      run_unit_tests: ${{ steps.detect.outputs.run_unit_tests }}
      run_integration_tests: ${{ steps.detect.outputs.run_integration_tests }}
      run_e2e_tests: ${{ steps.detect.outputs.run_e2e_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
          else
            git fetch origin main || git fetch origin master
          fi

      - name: Detect which tests to run
        id: detect
        env:
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          AFTER_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          chmod +x scripts/detect-tests.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/detect-tests.sh ${{ github.base_ref }}
          else
            ./scripts/detect-tests.sh main "$BEFORE_SHA" "$AFTER_SHA"
          fi

  detect-risk:
    name: Detect Risk Tier
    runs-on: ubuntu-latest
    outputs:
      risk_tier: ${{ steps.detect.outputs.risk_tier }}
      requires_deploy_checklist: ${{ steps.detect.outputs.requires_deploy_checklist }}
      requires_full_tests: ${{ steps.detect.outputs.requires_full_tests }}
      advisory_mode: ${{ steps.detect.outputs.advisory_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
          else
            git fetch origin main || git fetch origin master
          fi

      - name: Detect risk tier
        id: detect
        env:
          RISK_POLICY_MODE: ${{ vars.RISK_POLICY_MODE }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
          BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
          AFTER_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          chmod +x scripts/detect-risk-tier.sh
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/detect-risk-tier.sh ${{ github.base_ref }} "$PR_LABELS"
          else
            ./scripts/detect-risk-tier.sh main "$PR_LABELS" "$BEFORE_SHA" "$AFTER_SHA"
          fi

  pr-size-policy:
    name: PR Size Policy
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce PR size thresholds
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull request payload; skipping.');
              return;
            }

            const size = (pr.additions || 0) + (pr.deletions || 0);
            const labels = (pr.labels || []).map((l) => l.name);
            const hasException = labels.includes('size-exception');
            const warnThreshold = 300;
            const failThreshold = 600;

            core.info(`PR size: ${size} (additions: ${pr.additions}, deletions: ${pr.deletions})`);

            if (size > warnThreshold) {
              core.warning(
                `PR size ${size} is above recommended threshold (${warnThreshold}). Consider splitting into smaller PRs.`
              );
            }

            if (size > failThreshold && !hasException) {
              core.setFailed(
                `PR size ${size} exceeds hard limit (${failThreshold}). Add 'size-exception' label and include justification in PR body.`
              );
            }

            if (size > failThreshold && hasException) {
              core.warning(
                `PR size ${size} exceeds hard limit (${failThreshold}) but 'size-exception' label is present.`
              );
            }

  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [validate, detect-tests, detect-risk]
    if: |
      always() &&
      (needs.validate.result == 'success') &&
      (
        needs.detect-risk.outputs.risk_tier == 'medium' ||
        needs.detect-risk.outputs.risk_tier == 'high' ||
        needs.detect-risk.outputs.requires_full_tests == 'true' ||
        needs.detect-tests.outputs.run_all_tests == 'true' || 
        needs.detect-tests.outputs.run_unit_tests == 'true' || 
        needs.detect-tests.outputs.run_integration_tests == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        if: |
          needs.detect-risk.outputs.risk_tier == 'medium' ||
          needs.detect-risk.outputs.risk_tier == 'high' ||
          needs.detect-risk.outputs.requires_full_tests == 'true' ||
          needs.detect-tests.outputs.run_all_tests == 'true' ||
          needs.detect-tests.outputs.run_unit_tests == 'true'
        run: pnpm test:unit

      - name: Run integration tests
        if: |
          needs.detect-risk.outputs.risk_tier == 'medium' ||
          needs.detect-risk.outputs.risk_tier == 'high' ||
          needs.detect-risk.outputs.requires_full_tests == 'true' ||
          needs.detect-tests.outputs.run_all_tests == 'true' ||
          needs.detect-tests.outputs.run_integration_tests == 'true'
        run: pnpm test:integration

      - name: Run tests with coverage
        if: needs.detect-risk.outputs.requires_full_tests == 'true' || needs.detect-risk.outputs.risk_tier == 'high' || needs.detect-tests.outputs.run_all_tests == 'true'
        run: pnpm test:coverage

      - name: Upload coverage report
        if: needs.detect-risk.outputs.requires_full_tests == 'true' || needs.detect-risk.outputs.risk_tier == 'high' || needs.detect-tests.outputs.run_all_tests == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, detect-tests, detect-risk, unit-tests]
    if: |
      always() &&
      (needs.build.result == 'success') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (
        needs.detect-risk.outputs.risk_tier == 'medium' ||
        needs.detect-risk.outputs.risk_tier == 'high' ||
        needs.detect-risk.outputs.requires_full_tests == 'true' ||
        needs.detect-tests.outputs.run_all_tests == 'true' ||
        needs.detect-tests.outputs.run_e2e_tests == 'true'
      )
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          VITE_SUPABASE_URL: 'https://mock.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'mock-key'

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  high-risk-pr-checklist:
    name: High-Risk PR Checklist
    runs-on: ubuntu-latest
    needs: [detect-risk]
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-risk.outputs.requires_deploy_checklist == 'true'
    steps:
      - name: Validate required PR checklist items
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (!prNumber) {
              core.setFailed('Missing pull request number in event payload.');
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const body = pr.body || '';
            const requiredChecks = [
              /\[[xX]\]\s*High-Risk Deploy Checklist Completed/,
              /\[[xX]\]\s*Rollback Plan Included/,
              /\[[xX]\]\s*Refactor Regression Proof Added/
            ];
            const missing = requiredChecks.filter((re) => !re.test(body));
            if (missing.length === 0) {
              core.info('All required high-risk checklist items are present.');
              return;
            }
            const advisory = '${{ needs.detect-risk.outputs.advisory_mode }}' === 'true';
            const message = `Missing required high-risk checklist items in PR body (${missing.length}).`;
            if (advisory) {
              core.warning(`${message} Advisory mode enabled; not failing build.`);
            } else {
              core.setFailed(`${message} Enable checklist entries in pull_request_template.`);
            }
